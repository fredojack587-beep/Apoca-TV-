
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>APOCA TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#080b16;
--panel:#11182a;
--panel2:#171f35;
--line:#26314b;
--muted:#9aa7bf;
--accent:#7565f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:var(--bg);
color:#f5f7ff;
font-family:Arial,sans-serif;
min-height:100vh
}
header{
height:68px;padding:0 22px;
display:flex;align-items:center;
justify-content:space-between;
background:#0d1322;
border-bottom:1px solid var(--line);
position:sticky;top:0;z-index:5;gap:16px
}
.brand{font-size:23px;font-weight:800;letter-spacing:1px}
.brand span{color:#8b7cff}
.search{
width:min(360px,52vw);
padding:12px 15px;border-radius:10px;
border:1px solid var(--line);
background:var(--panel2);color:white;outline:none
}
.layout{
display:grid;
grid-template-columns:220px minmax(250px,1fr) minmax(280px,38%);
min-height:calc(100vh - 68px)
}
aside{
background:#0d1322;
border-right:1px solid var(--line);
padding:22px 14px
}
.side-title{
font-size:11px;color:#71809e;
font-weight:bold;letter-spacing:1.5px;
margin:8px 10px 14px
}
.cat{
display:flex;width:100%;gap:11px;
align-items:center;text-align:left;
padding:12px 13px;margin:4px 0;
border:0;border-radius:9px;
background:transparent;color:#b8c2d7;
cursor:pointer;font-size:14px
}
.cat:hover,.cat.active{
background:#242044;color:white
}
.cat.active{box-shadow:inset 3px 0 var(--accent)}
.source-note{
margin:24px 9px 0;padding-top:15px;
border-top:1px solid var(--line);
font-size:11px;line-height:1.6;color:#75829a
}
main{padding:22px;min-width:0}
.heading{
display:flex;justify-content:space-between;
align-items:center;gap:12px;margin-bottom:18px
}
.heading h1{font-size:22px}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.status{
font-size:11px;color:#aeb9ce;
text-align:right;max-width:46%
}
.channels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
gap:12px
}
.channel{
background:var(--panel);
border:1px solid #202a40;
border-radius:12px;overflow:hidden;
cursor:pointer;min-width:0;
transition:.15s;color:white;text-align:left
}
.channel:hover,.channel:focus{
border-color:#8274ff;transform:translateY(-2px);
outline:none
}
.logo-wrap{
height:90px;background:#192239;
display:flex;align-items:center;
justify-content:center;padding:12px
}
.channel img{max-width:100%;max-height:100%;object-fit:contain}
.fallback{font-size:25px;font-weight:bold;color:#a8b4d0}
.channel-name{
padding:10px;font-size:12px;font-weight:bold;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.channel-group{
padding:0 10px 10px;font-size:10px;
color:#8e9bb5;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis
}
.player-panel{
background:#0d1322;border-left:1px solid var(--line);
padding:20px;min-width:0
}
.player-panel h2{font-size:16px;margin-bottom:13px}
.screen{
background:#000;border:1px solid #202a40;
border-radius:13px;overflow:hidden;
aspect-ratio:16/9;display:flex;
align-items:center;justify-content:center
}
.screen video{width:100%;height:100%;background:#000}
.placeholder{
text-align:center;padding:20px;
color:#7e8ba5;font-size:13px;line-height:1.7
}
.playing-title{font-size:14px;font-weight:bold;margin-top:13px}
.playing-source{font-size:11px;color:#8290aa;margin-top:6px}
.player-help{
font-size:11px;line-height:1.6;
color:#74819a;margin-top:18px
}
.empty{
padding:35px 10px;text-align:center;
color:var(--muted);font-size:13px;grid-column:1/-1
}
.mobile-cats{display:none}

@media(max-width:900px){
.layout{grid-template-columns:175px minmax(0,1fr)}
.player-panel{
grid-column:1/-1;border-left:0;
border-top:1px solid var(--line)
}
.player-panel .screen{max-width:650px}
}
@media(max-width:600px){
header{height:60px;padding:0 13px}
.brand{font-size:19px}
.search{width:48vw;padding:10px}
.layout{display:block}
.layout aside{display:none}
main{padding:17px 13px}
.heading h1{font-size:19px}
.status{font-size:10px}
.channels{
grid-template-columns:repeat(3,minmax(0,1fr));
gap:8px
}
.logo-wrap{height:74px;padding:8px}
.channel-name{font-size:11px;padding:8px 6px}
.channel-group{font-size:9px;padding:0 6px 8px}
.mobile-cats{
display:flex;gap:8px;overflow:auto;
padding:0 13px 13px;background:#0d1322;
scrollbar-width:none
}
.mobile-cats button{
white-space:nowrap;padding:9px 13px;
border:1px solid var(--line);
border-radius:20px;background:var(--panel);
color:#d5dcf0;font-size:12px
}
.mobile-cats button.active{
background:#5144c7;border-color:#5144c7
}
.player-panel{padding:17px 13px}
.player-panel .screen{max-width:none}
}
</style>
</head>

<body>

<header>
<div class="brand">APOCA <span>TV</span></div>
<input id="search" class="search" type="search"
placeholder="Rechercher une chaîne…" autocomplete="off">
</header>

<div class="mobile-cats" id="mobileCats"></div>

<div class="layout">

<aside>
<div class="side-title">BIBLIOTHÈQUE</div>
<div id="sideCats"></div>
<div class="source-note" id="sourceStatus">
Préparation de la playlist…
</div>
</aside>

<main>
<div class="heading">
<div>
<h1 id="pageTitle">Toutes les chaînes</h1>
<div class="sub" id="subtitle">Vos chaînes au même endroit</div>
</div>
<div class="status" id="totalStatus">Chargement…</div>
</div>
<div class="channels" id="channelGrid">
<div class="empty">Chargement des chaînes…</div>
</div>
</main>

<section class="player-panel">
<h2>LECTEUR</h2>
<div class="screen" id="screen">
<div class="placeholder">
▶<br>Choisissez une chaîne pour commencer
</div>
</div>
<div class="playing-title" id="playingTitle">
Aucune chaîne sélectionnée
</div>
<div class="playing-source" id="playingSource"></div>
<div class="player-help">
Certaines chaînes peuvent être indisponibles ou incompatibles
avec le navigateur.
</div>
</section>

</div>

<script>
const PLAYLIST_URL =
"https://raw.githubusercontent.com/rikital/onyxia-data/main/data.m3u";

let allChannels=[];
let activeCategory="Tous";
let hlsPlayer=null;

const $=id=>document.getElementById(id);

function parseM3U(text){
const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/);
let current=null;
const out=[];

for(const raw of lines){
const line=raw.trim();

if(line.startsWith("#EXTINF")){
const name=line.split(",").slice(1).join(",").trim();
const group=line.match(/group-title="([^"]*)"/i);
const logo=line.match(/tvg-logo="([^"]*)"/i);
const tvg=line.match(/tvg-name="([^"]*)"/i);

current={
name:name||(tvg?tvg[1]:"Chaîne sans nom"),
category:group&&group[1]?group[1]:"Autres",
logo:logo?logo[1]:"",
url:""
};

}else if(line&&!line.startsWith("#")&&current){
current.url=line;
out.push(current);
current=null;
}
}
return out;
}

function categoryOf(c){
const s=(c.category+" "+c.name).toLowerCase();

if(/sport|football|soccer/.test(s))return "Sports";
if(/film|movie|cin[eé]ma|vod/.test(s))return "Films";
if(/s[eé]rie|series|drama/.test(s))return "Séries";

return "TV en direct";
}

function categories(){
return ["Tous","TV en direct","Sports","Films","Séries"];
}

function setCategory(cat){
activeCategory=cat;
$("pageTitle").textContent=
cat==="Tous"?"Toutes les chaînes":cat;
render();
renderCats();
}

function renderCats(){
["sideCats","mobileCats"].forEach(id=>{
const el=$(id);
el.innerHTML="";

categories().forEach(cat=>{
const b=document.createElement("button");
b.className=activeCategory===cat?"cat active":"cat";
b.textContent=cat;
b.onclick=()=>setCategory(cat);
el.appendChild(b);
});
});
}

function makeCard(c){
const card=document.createElement("button");
card.className="channel";
card.type="button";

const wrap=document.createElement("div");
wrap.className="logo-wrap";

if(c.logo){
const img=document.createElement("img");
img.src=c.logo;
img.alt="";
img.loading="lazy";

img.onerror=()=>{
img.remove();
const f=document.createElement("span");
f.className="fallback";
f.textContent=c.name.slice(0,1).toUpperCase();
wrap.appendChild(f);
};

wrap.appendChild(img);
}else{
const f=document.createElement("span");
f.className="fallback";
f.textContent=c.name.slice(0,1).toUpperCase();
wrap.appendChild(f);
}

const name=document.createElement("div");
name.className="channel-name";
name.textContent=c.name;

const group=document.createElement("div");
group.className="channel-group";
group.textContent=c.category;

card.append(wrap,name,group);
card.onclick=()=>play(c);

return card;
}

function render(){
const q=$("search").value.trim().toLowerCase();

let list=allChannels.filter(c=>
(c.name+" "+c.category).toLowerCase().includes(q)
);

if(activeCategory!=="Tous"){
list=list.filter(c=>categoryOf(c)===activeCategory);
}

$("channelGrid").innerHTML="";

if(!list.length){
$("channelGrid").innerHTML=
'<div class="empty">Aucune chaîne trouvée.</div>';
}else{
list.forEach(c=>
$("channelGrid").appendChild(makeCard(c))
);
}

$("totalStatus").textContent=
allChannels.length+" chaînes";

$("subtitle").textContent=
list.length+" résultat(s) affiché(s)";
}

function play(c){
const screen=$("screen");
screen.innerHTML="";

const video=document.createElement("video");
video.controls=true;
video.autoplay=true;
video.playsInline=true;
screen.appendChild(video);

$("playingTitle").textContent=c.name;
$("playingSource").textContent="TV en direct";

if(hlsPlayer){
hlsPlayer.destroy();
hlsPlayer=null;
}

video.pause();
video.removeAttribute("src");
video.load();

if(/\.m3u8($|\?)/i.test(c.url)&&
window.Hls&&Hls.isSupported()){

hlsPlayer=new Hls();
hlsPlayer.loadSource(c.url);
hlsPlayer.attachMedia(video);

hlsPlayer.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play().catch(()=>{});
});

}else{
video.src=c.url;
video.play().catch(()=>{});
}
}

async function start(){
const status=$("sourceStatus");

try{
const response=await fetch(PLAYLIST_URL,{cache:"no-store"});

if(!response.ok){
throw new Error("HTTP "+response.status);
}

const body=await response.text();

if(!body.includes("#EXTM3U")){
throw new Error("Fichier M3U invalide");
}

allChannels=parseM3U(body);

if(!allChannels.length){
throw new Error("Aucune chaîne trouvée");
}

status.textContent="Playlist chargée avec succès.";

$("totalStatus").textContent=
allChannels.length+" chaînes chargées";

renderCats();
render();

}catch(error){
status.textContent="Erreur : "+error.message;
$("channelGrid").innerHTML=
'<div class="empty">Impossible de charger la playlist. Vérifiez son accès et les autorisations CORS.</div>';
$("totalStatus").textContent="Erreur de chargement";
}
}

$("search").addEventListener("input",render);
start();
</script>

</body>
</html>
