
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>Apoca TV</title>

<style>
:root {
  --bg:#080d18;
  --panel:#111a2b;
  --blue:#168cff;
  --cyan:#00d9ff;
  --text:#f4f7ff;
  --muted:#91a1bb;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header {
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 20px;
  background:#0c1423;
  border-bottom:1px solid #24334a;
}

.logo {
  width:45px;
  height:45px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:bold;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
}

header h1 {margin:0;font-size:23px}
header p {margin:4px 0 0;color:var(--muted);font-size:12px}

main {max-width:1500px;margin:auto;padding:15px}

/* MENU HORIZONTAL */

.nav {
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:12px 0;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar {display:none}

.nav button {
  flex-shrink:0;
  background:#17243a;
  color:#cbd8ed;
  border-radius:25px;
  padding:11px 19px;
  white-space:nowrap;
}

.nav button.active {
  background:var(--blue);
  color:white;
}

/* LECTEUR */

.player-panel {
  background:var(--panel);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:18px;
}

.player-heading {padding:13px 16px}
.player-heading h2 {margin:0;font-size:18px}
.player-heading p {color:var(--muted);margin:6px 0 0}

video {
  display:block;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  object-fit:contain;
}

.controls {padding:12px}

button {
  border:0;
  cursor:pointer;
  color:white;
  background:var(--blue);
  font-weight:bold;
  padding:11px 16px;
  border-radius:9px;
}

/* LISTE DES CHAINES */

.channels-panel {
  background:var(--panel);
  border-radius:14px;
  padding:14px;
}

.channels-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.channels-header h2 {margin:0;font-size:18px}

#search {
  background:#080f1d;
  color:white;
  border:1px solid #30405b;
  padding:12px;
  border-radius:9px;
  width:100%;
  max-width:350px;
}

#channelList {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:12px;
}

.channel {
  background:#17243a;
  border-radius:11px;
  padding:12px;
  text-align:center;
  cursor:pointer;
  min-width:0;
  transition:.2s;
}

.channel:hover {
  background:#203c60;
  transform:translateY(-2px);
}

.channel img {
  width:65px;
  height:65px;
  object-fit:contain;
  margin-bottom:8px;
  border-radius:8px;
}

.channel-name {
  font-size:13px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.channel-group {
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.empty {
  color:var(--muted);
  padding:20px;
  text-align:center;
}

#status {
  font-size:12px;
  color:var(--muted);
  padding:8px 2px;
}

footer {
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:600px) {
  main {padding:10px}
  #channelList {
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }
  .channel {padding:9px 5px}
  .channel img {width:48px;height:48px}
  .channel-name {font-size:11px}
  .channels-header {align-items:stretch}
  #search {max-width:none}
}
</style>
</head>

<body>

<header>
  <div class="logo">A</div>
  <div>
    <h1>APOCA TV</h1>
    <p>Votre télévision, partout avec vous</p>
  </div>
</header>

<main>

<!-- CATEGORIES HORIZONTALES -->

<nav class="nav" id="categoryMenu">
  <button class="active" data-category="ALL">TOUT</button>
</nav>

<!-- LECTEUR VIDEO -->

<section class="player-panel">

  <div class="player-heading">
    <h2 id="playingTitle">Bienvenue sur APOCA TV</h2>
    <p id="playingSubtitle">Choisissez votre chaîne préférée</p>
  </div>

  <video id="player" controls playsinline></video>

  <div class="controls">
    <button id="fullscreenButton">Plein écran</button>
    <button id="stopButton" style="background:#263650">
      Arrêter
    </button>
  </div>

</section>

<!-- CHAINES -->

<section class="channels-panel">

  <div class="channels-header">
    <h2>Chaînes TV</h2>
    <input id="search" type="search"
      placeholder="Rechercher une chaîne...">
  </div>

  <div id="status">Chargement des chaînes...</div>

  <div id="channelList">
    <p class="empty">Chargement...</p>
  </div>

</section>

</main>

<footer>
APOCA TV © 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

<script>

const video = document.getElementById("player");
const channelList = document.getElementById("channelList");
const categoryMenu = document.getElementById("categoryMenu");
const searchInput = document.getElementById("search");
const statusText = document.getElementById("status");

let channels = [];
let hls = null;
let selectedCategory = "ALL";

function status(message) {
  statusText.textContent = message;
}

function getAttribute(line,name) {
  const match = line.match(
    new RegExp(name+'="([^"]*)"',"i")
  );
  return match ? match[1] : "";
}

/* LECTURE DU FICHIER M3U */

function parseM3U(data) {

  const lines = data.split(/\r?\n/);
  const result = [];
  let current = null;

  for(const raw of lines) {

    const line = raw.trim();
    if(!line) continue;

    if(line.startsWith("#EXTINF")) {

      const comma = line.lastIndexOf(",");

      const name = comma >= 0
        ? line.slice(comma+1).trim()
        : "Chaîne sans nom";

      current = {
        name:name,
        group:getAttribute(line,"group-title") || "Autres",
        logo:getAttribute(line,"tvg-logo"),
        url:""
      };

    } else if(!line.startsWith("#") && current) {

      current.url = line;
      result.push(current);
      current = null;

    }
  }

  return result;
}

/* CHARGEMENT AUTOMATIQUE */

async function loadPlaylist() {

  try {

    status("Chargement de la playlist...");

    const response = await fetch(
      "./tv_channels_HC22PAH_plus.m3u"
    );

    if(!response.ok) {
      throw new Error("Fichier M3U introuvable");
    }

    const data = await response.text();

    if(!data.includes("#EXTM3U")) {
      throw new Error("Playlist M3U invalide");
    }

    channels = parseM3U(data);

    if(!channels.length) {
      throw new Error("Aucune chaîne trouvée");
    }

    createCategories();
    renderChannels();

    status(channels.length+" chaînes chargées avec succès.");

  } catch(error) {

    status(
      "Erreur : "+error.message+
      ". Vérifiez que le fichier M3U est dans le même dossier."
    );

    channelList.innerHTML =
      '<p class="empty">Impossible de charger les chaînes.</p>';

  }
}

/* CREATION DES CATEGORIES */

function createCategories() {

  const categories = [
    ...new Set(channels.map(c=>c.group))
  ].sort((a,b)=>a.localeCompare(b));

  categoryMenu.innerHTML = "";

  addCategoryButton("TOUT","ALL",true);

  categories.forEach(category=>{
    addCategoryButton(category,category,false);
  });

}

function addCategoryButton(label,value,active) {

  const button = document.createElement("button");

  button.textContent = label;
  button.dataset.category = value;

  if(active) button.classList.add("active");

  button.addEventListener("click",()=>{

    selectedCategory = value;

    categoryMenu.querySelectorAll("button")
      .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

    renderChannels();

  });

  categoryMenu.appendChild(button);
}

/* AFFICHAGE DES CHAINES */

function renderChannels() {

  const query = searchInput.value.toLowerCase().trim();

  const filtered = channels.filter(channel=>{

    const categoryMatch =
      selectedCategory === "ALL" ||
      channel.group === selectedCategory;

    const searchMatch =
      channel.name.toLowerCase().includes(query) ||
      channel.group.toLowerCase().includes(query);

    return categoryMatch && searchMatch;

  });

  channelList.replaceChildren();

  if(!filtered.length) {

    channelList.innerHTML =
      '<p class="empty">Aucune chaîne trouvée.</p>';

    return;
  }

  filtered.forEach(channel=>{

    const item = document.createElement("div");
    item.className = "channel";

    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = channel.logo || "";

    img.onerror = ()=>{
      img.style.visibility = "hidden";
    };

    const name = document.createElement("div");
    name.className = "channel-name";
    name.textContent = channel.name;

    const group = document.createElement("div");
    group.className = "channel-group";
    group.textContent = channel.group;

    item.append(img,name,group);

    item.addEventListener("click",()=>{
      playChannel(channel);
    });

    channelList.appendChild(item);

  });

}

/* LECTURE DES CHAINES */

function playChannel(channel) {

  if(hls) {
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  document.getElementById("playingTitle")
    .textContent = channel.name;

  document.getElementById("playingSubtitle")
    .textContent = channel.group;

  const streamUrl = channel.url;

  if(/\.m3u8($|\?)/i.test(streamUrl) &&
     window.Hls && Hls.isSupported()) {

    hls = new Hls();

    hls.loadSource(streamUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.ERROR,(_,data)=>{

      if(data.fatal) {
        status("Erreur de lecture de cette chaîne.");
      }

    });

  } else {

    video.src = streamUrl;
    video.load();

  }

  video.play().catch(()=>{
    status("Appuyez sur lecture pour démarrer la chaîne.");
  });

}

/* RECHERCHE */

searchInput.addEventListener("input",renderChannels);

/* ARRETER */

document.getElementById("stopButton")
.addEventListener("click",()=>{

  video.pause();
  video.removeAttribute("src");
  video.load();

  if(hls) {
    hls.destroy();
    hls = null;
  }

});

/* PLEIN ECRAN */

document.getElementById("fullscreenButton")
.addEventListener("click",()=>{

  if(video.requestFullscreen) {
    video.requestFullscreen();
  }

});

/* DEMARRAGE AUTOMATIQUE */

loadPlaylist();

</script>

</body>
</html>
