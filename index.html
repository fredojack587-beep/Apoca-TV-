
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>APOCA TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#080d18;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 padding:18px 15px;
 background:#101a2c;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.logo{
 font-size:24px;
 font-weight:bold;
 color:#e50936;
}

.logo span{color:white}

.search{
 padding:10px;
 background:#19263b;
 border:none;
 border-radius:8px;
 color:white;
 width:130px;
 outline:none;
}

nav{
 display:flex;
 overflow-x:auto;
 white-space:nowrap;
 gap:25px;
 padding:16px;
 background:#101a2c;
 border-top:1px solid #26334a;
 border-bottom:1px solid #26334a;
 scrollbar-width:none;
}

nav::-webkit-scrollbar,
.categories::-webkit-scrollbar{display:none}

nav button{
 background:none;
 border:none;
 color:#aab5c7;
 font-size:14px;
 font-weight:bold;
 cursor:pointer;
 flex-shrink:0;
}

nav button.active{color:#e50936}

.container{padding:16px}

h2{
 font-size:19px;
 margin-bottom:15px;
}

.categories{
 display:flex;
 overflow-x:auto;
 gap:10px;
 margin-bottom:22px;
 scrollbar-width:none;
}

.categories button{
 flex-shrink:0;
 padding:10px 16px;
 border-radius:20px;
 border:1px solid #26334a;
 background:#142137;
 color:white;
}

.categories button.active{
 background:#e50936;
 border-color:#e50936;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:12px;
}

.channel{
 background:#142137;
 border-radius:10px;
 overflow:hidden;
 cursor:pointer;
 min-width:0;
}

.channel img{
 width:100%;
 height:85px;
 object-fit:contain;
 padding:10px;
 background:#1c2b43;
}

.channel p{
 padding:9px 5px;
 font-size:12px;
 text-align:center;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.player{
 display:none;
 background:#000;
 margin-bottom:20px;
 border-radius:10px;
 overflow:hidden;
}

video{
 width:100%;
 max-height:240px;
 background:#000;
}

.player-title{
 padding:12px;
 font-weight:bold;
}

.message{
 text-align:center;
 padding:35px 10px;
 color:#aab5c7;
 font-size:14px;
}

.section{display:none}
.section.active{display:block}

@media(min-width:700px){
 .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
 video{max-height:450px}
 .channel img{height:120px}
}
</style>
</head>

<body>

<header>
 <div class="logo">APOCA <span>TV</span></div>
 <input class="search" id="search"
 placeholder="Rechercher..." oninput="render()">
</header>

<nav>
 <button class="active" onclick="showSection('home',this)">Accueil</button>
 <button onclick="showSection('live',this)">TV EN DIRECT</button>
 <button onclick="showSection('movies',this)">FILMS</button>
 <button onclick="showSection('series',this)">SÉRIES</button>
 <button onclick="showSection('favorites',this)">FAVORIS</button>
</nav>

<main class="container">

<div class="player" id="player">
 <video id="video" controls autoplay playsinline></video>
 <div class="player-title" id="playerTitle"></div>
</div>

<section class="section active" id="home">
 <h2>Bienvenue sur APOCA TV</h2>
 <p style="color:#aab5c7;margin-bottom:20px">
 Retrouvez vos programmes préférés.
 </p>
 <h2>Nos chaînes</h2>
 <div class="categories" id="categories"></div>
 <div class="grid" id="channels"></div>
 <div class="message" id="status">Chargement de la playlist...</div>
</section>

<section class="section" id="live">
 <h2>TV EN DIRECT</h2>
 <div class="categories" id="categoriesLive"></div>
 <div class="grid" id="liveChannels"></div>
</section>

<section class="section" id="movies">
 <h2>FILMS</h2>
 <div class="grid" id="movieChannels"></div>
</section>

<section class="section" id="series">
 <h2>SÉRIES</h2>
 <div class="grid" id="seriesChannels"></div>
</section>

<section class="section" id="favorites">
 <h2>MES FAVORIS</h2>
 <div class="grid" id="favoriteChannels"></div>
</section>

</main>

<script>
const PLAYLIST_URL="./tv_channels_HC22PAH_plus.m3u";

let channels=[];
let selectedCategory="Tous";
let favorites=JSON.parse(localStorage.getItem("apoca_favorites")||"[]");

function showSection(id,button){
 document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");

 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");

 document.getElementById("player").style.display="none";
}

function parseM3U(data){
 const lines=data.split(/\r?\n/);
 let result=[];
 let current=null;

 for(let line of lines){
  line=line.trim();

  if(line.startsWith("#EXTINF")){
   const name=line.split(",").slice(1).join(",").trim();

   const group=line.match(/group-title="([^"]*)"/i);
   const logo=line.match(/tvg-logo="([^"]*)"/i);

   current={
    name:name||"Chaîne sans nom",
    category:group?group[1]:"Autres",
    logo:logo?logo[1]:"",
    url:""
   };
  }
  else if(line && !line.startsWith("#") && current){
   current.url=line;
   result.push(current);
   current=null;
  }
 }
 return result;
}

function getType(channel){
 const c=channel.category.toLowerCase();
 const n=channel.name.toLowerCase();

 if(c.includes("movie")||c.includes("film")||n.includes("vod"))
  return "movies";

 if(c.includes("series")||c.includes("série"))
  return "series";

 return "live";
}

function makeCard(channel){
 const card=document.createElement("div");
 card.className="channel";

 const img=document.createElement("img");
 img.src=channel.logo||"";
 img.alt="";
 img.onerror=function(){
  this.style.display="none";
 };

 const name=document.createElement("p");
 name.textContent=channel.name;

 card.appendChild(img);
 card.appendChild(name);

 card.onclick=()=>playChannel(channel);

 return card;
}

function renderCategories(){
 const categories=["Tous",...new Set(channels.map(c=>c.category))];

 ["categories","categoriesLive"].forEach(id=>{
  const el=document.getElementById(id);
  el.innerHTML="";

  categories.forEach(cat=>{
   const btn=document.createElement("button");
   btn.textContent=cat;
   btn.className=cat===selectedCategory?"active":"";

   btn.onclick=()=>{
    selectedCategory=cat;
    render();
    renderCategories();
   };

   el.appendChild(btn);
  });
 });
}

function render(){
 const search=document.getElementById("search").value.toLowerCase();

 const filtered=channels.filter(c=>{
  const matchName=c.name.toLowerCase().includes(search);
  const matchCategory=selectedCategory==="Tous"||c.category===selectedCategory;
  return matchName&&matchCategory;
 });

 const live=filtered.filter(c=>getType(c)==="live");
 const movies=filtered.filter(c=>getType(c)==="movies");
 const series=filtered.filter(c=>getType(c)==="series");

 function fill(id,list){
  const el=document.getElementById(id);
  el.innerHTML="";
  list.forEach(c=>el.appendChild(makeCard(c)));
 }

 fill("channels",filtered);
 fill("liveChannels",live);
 fill("movieChannels",movies);
 fill("seriesChannels",series);
 fill("favoriteChannels",
  channels.filter(c=>favorites.includes(c.url))
 );
}

function playChannel(channel){
 const player=document.getElementById("player");
 const video=document.getElementById("video");

 player.style.display="block";
 document.getElementById("playerTitle").textContent=channel.name;

 video.pause();
 video.removeAttribute("src");
 video.load();

 if(window.currentHls){
  window.currentHls.destroy();
  window.currentHls=null;
 }

 if(Hls.isSupported() && channel.url.includes(".m3u8")){
  const hls=new Hls();
  window.currentHls=hls;
  hls.loadSource(channel.url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
 }else{
  video.src=channel.url;
  video.play().catch(()=>{});
 }

 player.scrollIntoView({behavior:"smooth",block:"start"});
}

async function loadPlaylist(){
 const status=document.getElementById("status");

 try{
  const response=await fetch(PLAYLIST_URL);

  if(!response.ok)throw new Error("Playlist introuvable.");

  const data=await response.text();

  if(!data.includes("#EXTM3U"))
   throw new Error("Format M3U invalide.");

  channels=parseM3U(data);

  if(!channels.length)
   throw new Error("Aucune chaîne trouvée.");

  renderCategories();
  render();

  status.textContent=channels.length+" chaînes chargées.";

 }catch(error){
  status.textContent="Erreur : "+error.message+
  " Vérifie le fichier M3U sur GitHub.";
 }
}

loadPlaylist();
</script>

</body>
</html>
